name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The x86_64 format-validation step below deliberately does not run on the
  # pull_request path (see its own comment for the cost arithmetic). This makes
  # it runnable on demand against any branch, which is how its runtime can be
  # measured against this repo's build - the same shape Crypta uses (see
  # basilica-audio/Crypta PR #110).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            # 35 -> 40 with the x86_64 format-validation step (issue #52). The
            # step runs only on push/workflow_dispatch and carries its own
            # 15-minute step timeout; 40 keeps the job's bound meaningful
            # rather than letting the step's bound become the real one. The
            # identical step measured 3 min 26 s in Crypta (the same engine
            # family and plugin surface - basilica-audio/Crypta PR #110)
            # against a job that was otherwise well inside 35.
            timeout: 40
          - os: windows-latest
            timeout: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set CPM source cache path
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"

      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CPM_SOURCE_CACHE }}
          key: ${{ runner.os }}-cpm-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Verify bundled impulse responses
        # macOS only, on purpose. The assets are platform-independent bytes, so
        # verifying them twice proves nothing; and `python3` is not reliably on
        # PATH inside bash on the Windows runners, which would redden the job
        # for a reason having nothing to do with the audio.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Measures the shipped .wav files as signals - format, clipping, DC,
          # unity peak magnitude response, decay, and the SHA-256 of each
          # against the committed provenance record - and fails the job on any
          # of them. Standard library only, so there is nothing to install.
          # See resources/irs/LICENSES.md and tools/ir-synth/cabsynth.py.
          python3 tools/ir-synth/verify_irs.py resources/irs \
            --expect-manifest resources/irs/manifest.json \
            --min-files 9

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Test (macOS, arm64 slice)
        # ctest runs the Universal Binary, and macOS picks the slice matching
        # the host - so this is the arm64 slice, on every GitHub-hosted macOS
        # runner. Named accordingly (issue #52): for the whole life of this
        # workflow it read as "the macOS tests" while executing half of what
        # macOS ships. The x86_64 *test-suite* story is carried by
        # windows-latest, which runs the whole suite on genuine x86_64
        # hardware; the x86_64 *format-validation* story is the dedicated
        # step below.
        if: runner.os == 'macOS'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Locate plugin artefacts
        id: artefacts
        shell: bash
        env:
          ARTEFACT_ROOT: build/Nave_artefacts
          # Must match the configuration the build steps above actually produce:
          # -DCMAKE_BUILD_TYPE=Release on macOS, --config Release on Windows.
          # JUCE emits artefacts into <target>_artefacts/<CONFIG>/ for both
          # single- and multi-config generators.
          BUILD_CONFIG: Release
        run: |
          set -euo pipefail

          CONFIG_ROOT="$ARTEFACT_ROOT/$BUILD_CONFIG"
          if [ ! -d "$CONFIG_ROOT" ]; then
            echo "::error::No $BUILD_CONFIG artefact directory at $CONFIG_ROOT"
            echo "Contents of $ARTEFACT_ROOT:"
            ls -la "$ARTEFACT_ROOT" || true
            exit 1
          fi

          # Resolve exactly one artefact of the requested kind, scoped to the
          # configuration that was built. The previous locator searched the whole
          # artefact root and took `head -n 1`, which on Windows resolved the
          # stale multi-config Debug/ bundle: pluginval then scanned a directory
          # the plugin had never been built into. See basilica-audio/Nave#36.
          find_artefact() {
            local kind="$1"
            local matches count
            matches=$(find "$CONFIG_ROOT" -maxdepth 2 -type d -iname "*.$kind" | sort)
            count=$(printf '%s' "$matches" | grep -c . || true)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected exactly one .$kind artefact under $CONFIG_ROOT, found $count" >&2
              printf '%s\n' "$matches" >&2
              return 1
            fi
            printf '%s' "$matches"
          }

          VST3_PATH=$(find_artefact vst3)
          echo "vst3_path=$VST3_PATH" >> "$GITHUB_OUTPUT"
          echo "Found VST3 at: $VST3_PATH"

          if [ "$RUNNER_OS" = "macOS" ]; then
            COMPONENT_PATH=$(find_artefact component)
            echo "component_path=$COMPONENT_PATH" >> "$GITHUB_OUTPUT"
            echo "Found AU component at: $COMPONENT_PATH"
          fi

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
        run: |
          set -euo pipefail
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip -d pluginval
          chmod +x "pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          $actualHash = (Get-FileHash -Path pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $env:PLUGINVAL_WINDOWS_SHA256) {
            Write-Error "pluginval.zip checksum mismatch: expected $env:PLUGINVAL_WINDOWS_SHA256, got $actualHash"
            exit 1
          }
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval

      - name: Install AU component (macOS)
        id: install_au
        if: runner.os == 'macOS'
        shell: bash
        env:
          COMPONENT_PATH: ${{ steps.artefacts.outputs.component_path }}
        run: |
          set -euo pipefail
          # Installed before validation rather than after, because macOS only
          # resolves an AU that is registered with the system: pluginval scans
          # the component through AudioUnitPluginFormat, not by reading the
          # bundle off disk.
          COMPONENTS_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          COMPONENT_NAME=$(basename "$COMPONENT_PATH")
          INSTALLED_PATH="${COMPONENTS_DIR:?}/${COMPONENT_NAME:?}"

          mkdir -p "$COMPONENTS_DIR"
          rm -rf "$INSTALLED_PATH"
          cp -R "$COMPONENT_PATH" "$COMPONENTS_DIR/"
          killall -9 AudioComponentRegistrar || true

          echo "installed_component_path=$INSTALLED_PATH" >> "$GITHUB_OUTPUT"
          echo "Installed AU component at: $INSTALLED_PATH"

      - name: Run pluginval (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        shell: bash
        env:
          VST3_PATH: ${{ steps.artefacts.outputs.vst3_path }}
          COMPONENT_PATH: ${{ steps.install_au.outputs.installed_component_path }}
        run: |
          set -euo pipefail
          PLUGINVAL="pluginval/pluginval.app/Contents/MacOS/pluginval"
          mkdir -p pluginval-logs

          validate() {
            local label="$1" target="$2"
            local log="pluginval-logs/${label}.log"
            local rc=0

            echo "::group::pluginval (${label}): ${target}"
            set +e
            "$PLUGINVAL" --strictness-level 10 --validate "$target" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            .github/scripts/assert-pluginval-passed.sh "$log" "$rc" "$label"
          }

          validate macos-vst3 "$VST3_PATH"
          # The AU is a separately built binary. auval alone never put it through
          # pluginval's strictness-10 sweep, so half the shipped macOS surface was
          # unvalidated. See basilica-audio/Nave#36.
          validate macos-au "$COMPONENT_PATH"

      - name: Run pluginval (Windows)
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VST3_PATH: ${{ steps.artefacts.outputs.vst3_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path pluginval-logs | Out-Null
          $log = 'pluginval-logs/windows-vst3.log'
          $errLog = 'pluginval-logs/windows-vst3.err.log'

          # pluginval is built with juce_add_gui_app, so pluginval.exe is a
          # Windows GUI-subsystem binary. PowerShell's call operator does not
          # wait for GUI-subsystem processes and leaves $LASTEXITCODE unset,
          # which is exactly how a run printing "Num plugins found: 0",
          # "FAILURE" and "*** FAILED" still produced a green job
          # (basilica-audio/Nave#36). Start-Process -Wait -PassThru waits on the
          # process handle regardless of subsystem and yields a real ExitCode.
          $proc = Start-Process -FilePath '.\pluginval\pluginval.exe' `
            -ArgumentList @('--strictness-level', '10', '--validate', $env:VST3_PATH) `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError $errLog

          if ((Test-Path $errLog) -and ((Get-Item $errLog).Length -gt 0)) {
            Get-Content $errLog | Add-Content $log
          }

          Write-Host "::group::pluginval (windows-vst3): $env:VST3_PATH"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "::endgroup::"

          # A null ExitCode means we could not establish that it passed, which
          # must be treated as a failure rather than assumed to be zero.
          $code = if ($null -eq $proc.ExitCode) { 1 } else { $proc.ExitCode }

          & bash .github/scripts/assert-pluginval-passed.sh $log $code 'windows-vst3'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: auval validation (macOS)
        timeout-minutes: 5
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          auval -strict -v aufx Nave Yvsv

      - name: Validate the x86_64 slice (macOS)
        # Issue #52 (the basilica-audio/Crypta#108 twin): the pluginval and
        # auval passes above exercise the arm64 slice only, so the Intel half
        # of the shipped Universal Binary had no format validation at all.
        # The script asserts the x86_64 slice is present (lipo -archs), thins
        # a COPY of each bundle to x86_64 and puts it through pluginval
        # strictness 10 (VST3 under `arch -x86_64`, the AU via the x86_64
        # AUHostingServiceXPC) and `auval -strict` - see its header for why
        # thinning, not `arch`, is what selects the slice.
        #
        # Not on every pull request, and the reason is measured runtime rather
        # than preference: the identical step costs 3 min 26 s in Crypta
        # (basilica-audio/Crypta PR #110) on the most expensive minute in the
        # fleet (macOS bills at a 10x multiplier), against a defect class -
        # plugin-format conformance of the Intel slice - that changes far
        # less often than the DSP does. Placing it inside this job rather
        # than in a scheduled workflow of its own is what makes it affordable:
        # it reuses the Universal Binary this job already built, so there is
        # no second multi-minute build to pay for.
        #
        # The 15-minute step bound derives from that same measurement: 3 min
        # 26 s observed, plus headroom for a cold Rosetta install on a fresh
        # image, which the script performs itself when needed.
        timeout-minutes: 15
        if: runner.os == 'macOS' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          VST3_PATH: ${{ steps.artefacts.outputs.vst3_path }}
          COMPONENT_PATH: ${{ steps.artefacts.outputs.component_path }}
        run: |
          set -euo pipefail
          # The build-tree artefacts, not the installed copy: these are what
          # the release ships, and the script thins copies of them rather than
          # touching them.
          .github/scripts/validate-macos-x86_64-slice.sh \
            "$VST3_PATH" \
            "$COMPONENT_PATH" \
            "pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Upload x86_64 validation logs (macOS)
        # On failure only: when this step is the one that goes red, the
        # pluginval logs are the evidence, and they are long enough that
        # reading them out of the job log alone is awkward.
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nave-x86_64-validation-logs
          path: build/x86_64-validation/logs/**
          if-no-files-found: ignore

      - name: Upload plugin artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nave-${{ matrix.os }}
          path: build/Nave_artefacts/**
          if-no-files-found: error
