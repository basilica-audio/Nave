# release.yml — tag-triggered signed release build.
# Generated from /Users/yves/Development/Audio/.scaffold/release-workflow-template.yml
# with __NAME__ -> Nave (see CMakeLists.txt: project(Nave ...) / juce_add_plugin(Nave ...)).
#
# Security model:
#   - Triggered only by tags pushed to this repo (never by fork PRs; secrets are
#     unavailable to pull_request events from forks by GitHub design).
#   - Signing cert lives in org-level encrypted secrets, imported into a throwaway
#     keychain that is deleted in the job's post step.
#   - Minimal permissions: contents:write only (to attach release assets).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Creates the release for this tag - both platform jobs upload into it
      # with `gh release upload`, which needs the release object to exist first -
      # and gives it a body built from this repository's own CHANGELOG section
      # for the tag, plus the suite-wide signing/install footer. The asset table
      # is deliberately left out here: nothing has been uploaded yet. The
      # publish-release-notes job below fills it in once the archives exist.
      #
      # The action lives in basilica-audio/.github so the footer's wording is in
      # one place rather than thirteen. A tag with no matching CHANGELOG section
      # fails here, before anything is built or uploaded - fix the changelog and
      # re-tag rather than cleaning up a half-published release.
      - name: Create the release with notes from CHANGELOG.md
        uses: basilica-audio/.github/release-notes@main
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          include-assets: 'false'

  release-macos:
    name: Signed macOS release
    needs: create-release
    runs-on: macos-14
    # 45 -> 60 with the shipped-artefact validation steps (issue #53): two
    # native pluginval strictness-10 passes, auval, and the x86_64
    # thinned-slice gate, bounded at 20+10+15 minutes respectively below.
    # The signing/notarization step keeps its own 40-minute bound; 60 keeps
    # the job bound meaningful for the common case (notarization in single
    # minutes) without the validation steps' worst case eating the whole
    # budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set CPM source cache path
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"

      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure & build (Release, universal)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --target Nave_AU Nave_VST3 Nave_Standalone --parallel 3

      - name: Import signing certificate (throwaway keychain)
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC=$RUNNER_TEMP/release.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, package
        timeout-minutes: 40
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          ARTEFACT_ROOT="build/Nave_artefacts"
          # JUCE's artefact path may or may not include a Release/ segment
          # depending on whether the generator is single- or multi-config
          # (this build uses single-config Ninja); see the equivalent
          # find-based lookup in ci.yml's "Locate plugin artefacts" step.
          find_artefact_dir() {
            local pattern="$1"
            local path
            path=$(find "$ARTEFACT_ROOT" -type d -iname "$pattern" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::No $pattern artefact found under $ARTEFACT_ROOT"
              exit 1
            fi
            dirname "$path"
          }
          COMPONENT_DIR=$(find_artefact_dir "*.component")
          VST3_DIR=$(find_artefact_dir "*.vst3")
          STANDALONE_DIR=$(find_artefact_dir "*.app")
          mkdir -p stage/AU stage/VST3 stage/Standalone
          cp -R "$COMPONENT_DIR/"*.component stage/AU/
          cp -R "$VST3_DIR/"*.vst3 stage/VST3/
          cp -R "$STANDALONE_DIR/"*.app stage/Standalone/
          # Bundled factory IR library (issue #33): nine GENERATED cabinet
          # models - not recordings - plus their CC0 dedication and the
          # provenance record. Shipped as files rather than embedded in the
          # binary because Nave's IR browser is a directory scanner: the user
          # copies this folder to IrLibrary::defaultDirectory()
          # (<music dir>/Nave/Impulse Responses) and the browser lists it.
          # See resources/irs/LICENSES.md and resources/irs/INSTALL.txt.
          mkdir -p "stage/Impulse Responses"
          cp resources/irs/*.wav "stage/Impulse Responses/"
          cp resources/irs/INSTALL.txt resources/irs/LICENSES.md \
             resources/irs/CC0-1.0.txt resources/irs/manifest.json "stage/Impulse Responses/"
          for B in stage/AU/*.component stage/VST3/*.vst3 stage/Standalone/*.app; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$B"
            codesign --verify --strict "$B"
          done
          echo "$API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --norsrc --noextattr --noqtn --noacl stage notarize-me.zip
          xcrun notarytool submit notarize-me.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --timeout 30m
          rm "$RUNNER_TEMP/AuthKey.p8"
          for B in stage/AU/*.component stage/VST3/*.vst3 stage/Standalone/*.app; do
            xcrun stapler staple "$B"
          done
          SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          ditto -c -k --norsrc --noextattr --noqtn --noacl stage "$SLUG-$GITHUB_REF_NAME-macos.zip"
          echo "ASSET=$SLUG-$GITHUB_REF_NAME-macos.zip" >> "$GITHUB_ENV"

      - name: Delete throwaway keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

      # ------------------------------------------------------------------
      # Issue #53 (fleet audit class 1 follow-up): validate the artefacts
      # that actually ship - the signed, notarized, stapled bundles in
      # stage/ - before anything is uploaded. ci.yml validates its own
      # build of the same commit; the release job's build left the pipeline
      # unasserted. Same shape as basilica-audio/Tenebrae#42, with the
      # x86_64 half done by this repo's own thinned-slice gate (issue #52)
      # instead of `arch -x86_64` wrappers, for the reasons measured and
      # documented in .github/scripts/validate-macos-x86_64-slice.sh:
      # `arch` does not steer auval or pluginval's AU path, the component's
      # own slices select the XPC hosting service.
      #
      # Placed after the keychain teardown on purpose: none of this needs
      # signing material, and a validation failure must still leave the
      # keychain deleted. The ASSET zip already exists, but "Attach to
      # release" runs only if every step here passes - a red validation
      # keeps the artefact off the release page.
      # ------------------------------------------------------------------
      - name: Download pluginval
        env:
          PLUGINVAL_VERSION: v1.0.4
          PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
        run: |
          set -euo pipefail
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip -d pluginval
          chmod +x "pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Assert Universal Binary slices (shipped artefacts)
        run: |
          set -euo pipefail
          # Mirrors ci.yml's slice assertion, against the shipped bundles.
          assert_universal() {
            local bundle="$1" bin archs
            bin=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f | head -n 1)
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            for wanted in arm64 x86_64; do
              if ! grep -qw "$wanted" <<< "$archs"; then
                echo "::error::$bin is missing the $wanted slice (found: $archs)"
                exit 1
              fi
            done
          }
          assert_universal stage/VST3/*.vst3
          assert_universal stage/AU/*.component
          assert_universal stage/Standalone/*.app

      - name: Install shipped AU component
        id: install_au
        run: |
          set -euo pipefail
          # macOS only resolves an AU that is registered with the system:
          # pluginval scans the component through AudioUnitPluginFormat and
          # auval resolves by component code, not by reading the bundle off
          # disk. Install the signed stage/ copy, so what gets validated is
          # byte-for-byte what ships.
          COMPONENTS_DIR="$HOME/Library/Audio/Plug-Ins/Components"
          COMPONENT_PATH=$(echo stage/AU/*.component)
          COMPONENT_NAME=$(basename "$COMPONENT_PATH")
          INSTALLED_PATH="${COMPONENTS_DIR:?}/${COMPONENT_NAME:?}"
          mkdir -p "$COMPONENTS_DIR"
          rm -rf "$INSTALLED_PATH"
          cp -R "$COMPONENT_PATH" "$COMPONENTS_DIR/"
          killall -9 AudioComponentRegistrar || true
          echo "installed_component_path=$INSTALLED_PATH" >> "$GITHUB_OUTPUT"
          echo "Installed AU component at: $INSTALLED_PATH"

      - name: Run pluginval on shipped artefacts (arm64)
        timeout-minutes: 20
        env:
          COMPONENT_PATH: ${{ steps.install_au.outputs.installed_component_path }}
        run: |
          set -euo pipefail
          PLUGINVAL="pluginval/pluginval.app/Contents/MacOS/pluginval"
          VST3_PATH=$(echo stage/VST3/*.vst3)
          mkdir -p pluginval-logs

          validate() {
            local label="$1" target="$2"
            local log="pluginval-logs/${label}.log"
            local rc=0

            echo "::group::pluginval (${label}): ${target}"
            set +e
            "$PLUGINVAL" --strictness-level 10 --validate "$target" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"

            .github/scripts/assert-pluginval-passed.sh "$log" "$rc" "$label"
          }

          validate release-vst3-arm64 "$VST3_PATH"
          validate release-au-arm64 "$COMPONENT_PATH"

      - name: auval validation (shipped AU, arm64)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          auval -strict -v aufx Nave Yvsv

      - name: Validate the x86_64 slice (shipped artefacts)
        # The passes above exercised the arm64 slice only. The script asserts
        # the x86_64 slice is present, thins COPIES of the shipped bundles
        # and puts them through pluginval strictness 10 and auval -strict -
        # stage/ itself stays byte-for-byte what was notarized. 15-minute
        # bound as in ci.yml: 3 min 26 s measured for the identical step in
        # Crypta (basilica-audio/Crypta PR #110), plus headroom for a cold
        # Rosetta install.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          .github/scripts/validate-macos-x86_64-slice.sh \
            "$(echo stage/VST3/*.vst3)" \
            "$(echo stage/AU/*.component)" \
            "pluginval/pluginval.app/Contents/MacOS/pluginval"

      - name: Upload release validation logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nave-release-validation-logs
          path: |
            pluginval-logs/**
            build/x86_64-validation/logs/**
          if-no-files-found: ignore

      # basilica-audio/.github#5: checksum-and-upload computes and uploads
      # a `.sha256` alongside the archive, so a downloader can verify the
      # macOS zip byte for byte the same way the Windows job's zip already
      # could.
      - name: Attach to release
        uses: basilica-audio/.github/checksum-and-upload@main
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          assets: ${{ env.ASSET }}

  release-windows:
    name: Windows release (unsigned)
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set CPM source cache path
        shell: bash
        run: echo "CPM_SOURCE_CACHE=$HOME/.cache/CPM" >> "$GITHUB_ENV"
      - name: Cache CPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
      - name: Configure & build (Release)
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target Nave_VST3 Nave_Standalone --parallel 3
      - name: Package & attach
        shell: bash
        run: |
          set -euo pipefail
          ARTEFACT_ROOT="build/Nave_artefacts"
          # JUCE's artefact path may or may not include a Release/ segment
          # depending on whether the generator is single- or multi-config;
          # see the equivalent find-based lookup in ci.yml's "Locate plugin
          # artefacts" step.
          find_artefact_dir() {
            local type_flag="$1" pattern="$2"
            local path
            path=$(find "$ARTEFACT_ROOT" -type "$type_flag" -iname "$pattern" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::No $pattern artefact found under $ARTEFACT_ROOT"
              exit 1
            fi
            dirname "$path"
          }
          VST3_DIR=$(find_artefact_dir d "*.vst3")
          STANDALONE_DIR=$(find_artefact_dir f "*.exe")
          mkdir -p stage/VST3 stage/Standalone
          cp -R "$VST3_DIR/"*.vst3 stage/VST3/
          cp "$STANDALONE_DIR/"*.exe stage/Standalone/
          # Bundled factory IR library (issue #33): nine GENERATED cabinet
          # models - not recordings - plus their CC0 dedication and the
          # provenance record. Shipped as files rather than embedded in the
          # binary because Nave's IR browser is a directory scanner: the user
          # copies this folder to IrLibrary::defaultDirectory()
          # (<music dir>/Nave/Impulse Responses) and the browser lists it.
          # See resources/irs/LICENSES.md and resources/irs/INSTALL.txt.
          mkdir -p "stage/Impulse Responses"
          cp resources/irs/*.wav "stage/Impulse Responses/"
          cp resources/irs/INSTALL.txt resources/irs/LICENSES.md \
             resources/irs/CC0-1.0.txt resources/irs/manifest.json "stage/Impulse Responses/"
          SLUG=$(basename "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          cd stage && 7z a "../$SLUG-$GITHUB_REF_NAME-windows.zip" . && cd ..
          echo "ASSET=$SLUG-$GITHUB_REF_NAME-windows.zip" >> "$GITHUB_ENV"

      # basilica-audio/.github#5: same checksum-and-upload pairing as the
      # macOS job's "Attach to release" step - see the comment there.
      - name: Attach to release
        uses: basilica-audio/.github/checksum-and-upload@main
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          assets: ${{ env.ASSET }}

  publish-release-notes:
    name: Publish release notes
    needs: [release-macos, release-windows]
    # always(): a platform build that failed should still leave a readable
    # release page describing what did get attached, rather than a body frozen
    # before any asset existed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same body as above, now with a Downloads table rendered from the assets
      # actually attached to the release.
      - name: Rewrite the release body with the attached assets
        uses: basilica-audio/.github/release-notes@main
        with:
          tag: ${{ github.ref_name }}
          token: ${{ github.token }}
          include-assets: 'true'
